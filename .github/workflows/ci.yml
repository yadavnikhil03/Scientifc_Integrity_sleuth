name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        run: |
          cd backend
          python -m venv venv
          . venv/bin/activate
          pip install -r requirements.txt

      - name: Run backend tests
        run: |
          cd backend
          . venv/bin/activate
          python -m pytest -q

      - name: Install frontend deps
        run: |
          cd frontend
          npm install

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install Playwright browsers (with safe fallback)
        run: |
          cd frontend
          npm install
          # Try to install system dependencies + browsers; if distro not supported, install browsers only
          npx playwright install --with-deps || npx playwright install chromium

      - name: Run Playwright E2E
        run: |
          cd frontend
          npx vite preview --port 5173 &
          export PW_BASE_URL=http://localhost:5173
          npx playwright test --project=chromium --timeout=30000
